<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in (email and password)</title>
</head>
<body>
  <form id="loginForm" action="javascript:void(0)" method="post">
    <input type="text" id="email" name="email" autocomplete="email" placeholder="Email">
    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
