name: Browser tests

# headless Chromium suite (run-all.ts), including the e2e drivers against the simulated Apple helper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node test-harness/automation/build-test-extensions.ts
      - run: xvfb-run -a node test-harness/automation/run-all.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: test-harness/automation/shots/
          if-no-files-found: ignore
