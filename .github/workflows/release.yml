name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cd dist && zip -r ../passbridge.zip .
      # the helper install and uninstall scripts, each next to the policy, agent and updater helpers it copies
      - run: |
          mkdir -p helpers/passbridge-macos-helper helpers/passbridge-windows-helper
          cp native/install.sh native/uninstall.sh native/passbridge-policy.py native/passbridge-agent.py native/passbridge-agent-cli.py native/passbridge-updater.py helpers/passbridge-macos-helper/
          cp native/windows/install.ps1 native/windows/uninstall.ps1 native/windows/passbridge-policy.py native/passbridge-updater.py helpers/passbridge-windows-helper/
          # the helper reads this to know which release it came from
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > helpers/passbridge-macos-helper/VERSION
          echo "$VERSION" > helpers/passbridge-windows-helper/VERSION
          cd helpers
          zip -r ../passbridge-macos-helper.zip passbridge-macos-helper
          zip -r ../passbridge-windows-helper.zip passbridge-windows-helper
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            passbridge.zip
            passbridge-macos-helper.zip
            passbridge-windows-helper.zip
