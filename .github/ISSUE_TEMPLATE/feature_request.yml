name: Feature request
description: Suggest a change or something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like PassBridge to do?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Alternatives you tried, or how another password manager handles it.
